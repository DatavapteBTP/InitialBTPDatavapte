_schema-version: "3.2"
ID: datavapte-migration-studio
version: 1.0.2
description: SAP BTP CAP app that turns Data Migration Excel templates into UI5 screens

modules:
  - name: datavapte-migration-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 1024M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: datavapte-migration-db
      - name: datavapte-migration-uaa
      - name: datavapte-migration-destination-service
      - name: datavapte-migration-connectivity-service
  - name: datavapte-migration-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: datavapte-migration-db
  - name: datavapte-migration-destination-content
    type: com.sap.application.content
    requires:
    - name: datavapte-migration-destination-service
      parameters:
        content-target: true
    - name: datavapte-migration_html_repo_host
      parameters:
        service-key:
          name: datavapte-migration_html_repo_host-key
    - name: datavapte-migration-uaa
      parameters:
        service-key:
          name: datavapte-migration-uaa-key
    parameters:
      content:
        instance:
          destinations:
          - Name: AppRouterDatavapte_html_repo_host
            ServiceInstanceName: datavapte-migration-html5-app-host-service
            ServiceKeyName: datavapte-migration_html_repo_host-key
            sap.cloud.service: AppRouterDatavapte
          - Name: AppRouterDatavapte_datavapte-migration_html_repo_host
            ServiceInstanceName: datavapte-migration-html5-app-host-service
            ServiceKeyName: datavapte-migration_html_repo_host-key
            sap.cloud.service: AppRouterDatavapte
          - Authentication: OAuth2UserTokenExchange
            Name: AppRouterDatavapte_uaa
            ServiceInstanceName: datavapte-migration-xsuaa-service
            ServiceKeyName: datavapte-migration-uaa-key
            sap.cloud.service: AppRouterDatavapte
          - Authentication: OAuth2UserTokenExchange
            Name: AppRouterDatavapte_datavapte-migration_uaa
            ServiceInstanceName: datavapte-migration-xsuaa-service
            ServiceKeyName: datavapte-migration-uaa-key
            sap.cloud.service: AppRouterDatavapte
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: datavapte-migration-app-content
    type: com.sap.application.content
    path: app/html5-content
    requires:
    - name: datavapte-migration_html_repo_host
      parameters:
        content-target: true
    build-parameters:
      build-result: resources
      requires:
      - artifacts:
        - datavaptemigrationstudio.zip
        name: datavaptemigrationstudio
        target-path: resources/

  - name: datavaptemigrationstudio
    type: html5
    path: app/migration-studio
    build-parameters:
      supported-platforms: []
      build-result: dist
      builder: custom
      commands:
        - npm ci || npm install
        - npm run build
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: datavapte-migration
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: datavapte-migration_html_repo_runtime
      - name: datavapte-migration-destination-service
      - name: datavapte-migration-uaa
      - name: srv-api
        group: destinations
        properties:
          name: datavapte-migration-srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
- name: datavapte-migration-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: datavapte-migration-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: datavapte-migration-xsuaa-service
    service-plan: application
    service-keys:
      - name: datavapte-migration-uaa-key
- name: datavapte-migration-db
  type: com.sap.xs.hdi-container
  parameters:
    config:
      schema: ZINNOVAPTE_DATAVAPTE
    service: hana
    service-plan: hdi-shared
- name: datavapte-migration-destination-service
  type: org.cloudfoundry.managed-service
  requires:
  - name: srv-api
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: datavapte-migration-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.1
    service: destination
    service-name: datavapte-migration-destination-service
    service-plan: lite
- name: datavapte-migration-connectivity-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: datavapte-migration_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: datavapte-migration-html5-app-host-service
    service-plan: app-host
    service-keys:
      - name: datavapte-migration_html_repo_host-key
- name: datavapte-migration_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: datavapte-migration-html5-app-runtime-service
    service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
  