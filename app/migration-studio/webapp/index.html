<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datavapte Migration Studio</title>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.136.1/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.f,sap.ui.unified"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-resourceroots='{"datavapte.migration.studio": "./"}'
    data-sap-ui-xx-waitForTheme="true">
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
  </style>
</head>
<body class="sapUiBody" id="content">
  <div
    data-sap-ui-component
    data-name="datavapte.migration.studio"
    data-id="container"
    data-settings='{"id":"migrationStudio"}'
    style="height:100%">
  </div>
</body>
</html>
